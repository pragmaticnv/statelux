# LAB-01: Secure Suite-B (AES-256-GCM / DH Group 20 / PFS)
connections {
    secure-tunnel {
        local_addrs = 192.168.100.10
        remote_addrs = 192.168.100.20
        version = 2
        proposals = aes256gcm16-prfsha256-ecp384

        local {
            auth = psk
            id = gateway-a.stateflux.lab
        }
        remote {
            auth = psk
            id = gateway-b.stateflux.lab
        }

        children {
            secure-tunnel {
                local_ts = 10.1.0.0/16
                remote_ts = 10.2.0.0/16
                esp_proposals = aes256gcm16-ecp384
                rekey_time = 3600s
                start_action = start
            }
        }
    }
}

secrets {
    ike-lab01 {
        secret = "StatefluxControlledLabSecretKey2026!"
    }
}
