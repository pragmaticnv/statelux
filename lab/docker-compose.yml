version: "3.8"

services:
  gateway-a:
    build:
      context: ./strongswan
      dockerfile: Dockerfile
    container_name: stateflux-lab-gateway-a
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      lab-net:
        ipv4_address: 192.168.100.10
    volumes:
      - ./captures:/captures
      - ./scenarios:/scenarios:ro
    environment:
      - PEER_IP=192.168.100.20
      - HOSTNAME=gateway-a.stateflux.lab

  gateway-b:
    build:
      context: ./libreswan
      dockerfile: Dockerfile
    container_name: stateflux-lab-gateway-b
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      lab-net:
        ipv4_address: 192.168.100.20
    volumes:
      - ./captures:/captures
      - ./scenarios:/scenarios:ro
    environment:
      - PEER_IP=192.168.100.10
      - HOSTNAME=gateway-b.stateflux.lab

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
